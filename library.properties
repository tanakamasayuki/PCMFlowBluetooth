name=PCMFlowBluetooth
version=0.1.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Bluetooth Classic audio add-on for PCMFlow: A2DP SBC decode into a PCMSource.
paragraph=Connects the encoded Bluetooth Classic audio payloads handled by EspBle to PCMFlow's PCMSource / PCMSink boundary. Owns only the codec, the packet queue, and the PCM boundary - Bluetooth profiles stay in EspBle, device output stays in PCMFlow / PCMFlowDevice. The initial release decodes A2DP Sink SBC into interleaved signed 16-bit PCM on the plain ESP32. The SBC codec is vendored from the Apache-2.0 AOSP / ESP-IDF Bluedroid sources, so the queue and decoder logic build and unit-test on a host as well as on hardware.
category=Signal Input/Output
url=https://github.com/tanakamasayuki/PCMFlowBluetooth
architectures=*
depends=PCMFlow,EspBle
includes=PCMFlowBluetooth.h
