# EspBle's Classic Bluetooth support (EspBleClassic.h) is not in a published
# release yet, so this points at a local checkout next to this repository.
# Switch to a version pin — `- EspBle (x.y.z)` — once a release ships it.
profiles:
  esp32:
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../
      - dir: ../../../EspBle
      - PCMFlow (0.2.1)

default_profile: esp32
